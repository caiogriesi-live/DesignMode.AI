<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>480p Square Video Display (Max 480x480)</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
      margin: 0;
      font-family: Arial, sans-serif;
      color: #eee;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
    }
    .video-container {
      width: 100%;
      max-width: 380px;  /* Max width = height = 480px for 1:1 */
      aspect-ratio: 1 / 1; /* Force square aspect ratio */
      background: black;
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Keep video contained inside square without distortion */
      display: block;
      outline: none;
      background: black;
    }
    .upgrade-button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #00aaff;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .upgrade-button:hover {
      background: #0077aa;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <video controls preload="metadata" playsinline>
      <source src="video2.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
  </div>

  <button class="upgrade-button" onclick="alert('Upgrade to HD coming soon!')">
    Watch in HD
  </button>

</body>
</html>
