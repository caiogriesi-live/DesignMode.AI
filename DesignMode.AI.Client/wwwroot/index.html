    <script>
        window.currentAudio = null;

        window.playAudioFromUrl = async (audioUrl, dotNetHelper) => {
            console.log('Attempting to play audio:', audioUrl);

            try {
                if (window.currentAudio) {
                    window.currentAudio.pause();
                    window.currentAudio.currentTime = 0;
                    window.currentAudio = null;
                }

                const audio = new Audio(audioUrl);
                window.currentAudio = audio;

                audio.onended = async () => {
                    if (dotNetHelper) {
                        await dotNetHelper.invokeMethodAsync('OnAudioEnded', 0);
                    }
                    window.currentAudio = null;
                };

                audio.onerror = (error) => {
                    console.error('Audio playback error:', error);
                    window.currentAudio = null;

                    if (dotNetHelper) {
                        dotNetHelper.invokeMethodAsync('OnAudioEnded', 0);
                    }
                };

                await audio.play();
                return true;
            } catch (error) {
                console.error('Audio playback failed:', error);
                console.error('Audio URL:', audioUrl);
                throw error;
            }
        };

        window.stopAllAudio = () => {
            if (window.currentAudio) {
                window.currentAudio.pause();
                window.currentAudio.currentTime = 0;
                window.currentAudio = null;
                return true;
            }

            return false;
        };

        window.isMobileScreen = function () {
            return window.innerWidth <= 768;
        };
    </script>

        <script>
            (() => {
                const normalizeDateEventTarget = event => {
                    const input = event.target;
                    if (!(input instanceof HTMLInputElement) || input.getAttribute("type") !== "date" || input.type !== "text") return;

                    Object.defineProperty(input, "type", { configurable: true, get: () => "date" });
                    window.setTimeout(() => { delete input.type; }, 0);
                };

                document.addEventListener("input", normalizeDateEventTarget, true);
                document.addEventListener("change", normalizeDateEventTarget, true);
            })();
        </script>

    <script>
        window.playBrandVideo = function () {
            const vid = document.querySelector('.brand-video');

            if (!vid) return;

            vid.muted = true;
            vid.setAttribute("muted", "");
            vid.setAttribute("playsinline", "");
            vid.setAttribute("webkit-playsinline", "");

            const playPromise = vid.play();

            if (playPromise !== undefined) {
                playPromise.catch(err => {
                    console.log("iOS autoplay blocked:", err);
                });
            }
        };
    </script>
